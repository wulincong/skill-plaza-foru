<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>折线图示例 · 每月新增岗位记录</title>
  <style>
    figure { max-width: 38rem; margin: 2rem auto; font: 1rem/1.6 system-ui, sans-serif; color: #182e42 }
    svg { display: block; width: 100%; height: auto }
  </style>
</head>
<body>
  <figure data-chart-skill="line-chart" data-chart-id="CH_LINE">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190" role="img" aria-labelledby="CH_LINE-title CH_LINE-desc">
      <title id="CH_LINE-title">每月新增岗位记录</title>
      <desc id="CH_LINE-desc">2026 年 1 月至 3 月分别新增 4、6、5 条，2 月最多。</desc>
      <path d="M64 46H320 M64 82H320 M64 118H320" fill="none" stroke="#cbd5df"/>
      <path d="M64 28V154H320" fill="none" stroke="#526475"/>
      <polyline points="96,82 198,46 300,64" fill="none" stroke="#286596" stroke-width="3"/>
      <g fill="#286596">
        <circle cx="96" cy="82" r="4"/><circle cx="198" cy="46" r="4"/><circle cx="300" cy="64" r="4"/>
      </g>
      <g fill="#182e42" font-size="14" text-anchor="middle">
        <text x="72" y="18">新增记录数（条）</text>
        <text x="48" y="159">0</text><text x="48" y="123">2</text>
        <text x="48" y="87">4</text><text x="48" y="51">6</text>
        <text x="96" y="69">4</text><text x="198" y="33">6</text><text x="300" y="51">5</text>
        <text x="96" y="177">1 月</text><text x="198" y="177">2 月</text><text x="300" y="177">3 月</text>
      </g>
    </svg>
    <figcaption>每月新增岗位记录。教学样例，数据为模拟：甲市 1 月 4 条、2 月 6 条、3 月 5 条。各月均按岗位首次入库日期统计，模拟查询日与快照日均为 2026-03-31。</figcaption>
  </figure>
</body>
</html>
