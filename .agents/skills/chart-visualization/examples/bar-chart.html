<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>柱状图示例 · 岗位类别比较</title>
  <style>
    figure { max-width: 38rem; margin: 2rem auto; font: 1rem/1.6 system-ui, sans-serif; color: #182e42 }
    svg { display: block; width: 100%; height: auto }
  </style>
</head>
<body>
  <figure data-chart-skill="bar-chart" data-chart-id="CH_BAR">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" role="img" aria-labelledby="CH_BAR-title CH_BAR-desc">
      <title id="CH_BAR-title">两类岗位的记录数</title>
      <desc id="CH_BAR-desc">开发 6 条，测试 4 条。</desc>
      <g fill="#286596">
        <rect x="100" y="16" width="180" height="20"/>
        <rect x="100" y="48" width="120" height="20"/>
      </g>
      <path d="M100 10V82H280 M160 82v5 M220 82v5 M280 82v5" fill="none" stroke="#526475"/>
      <g fill="#182e42" font-size="14">
        <text x="46" y="31">开发</text><text x="288" y="31">6</text>
        <text x="46" y="63">测试</text><text x="228" y="63">4</text>
        <g text-anchor="middle">
          <text x="100" y="105">0</text><text x="160" y="105">2</text>
          <text x="220" y="105">4</text><text x="280" y="105">6</text>
          <text x="190" y="132">岗位记录数（条）</text>
        </g>
      </g>
    </svg>
    <figcaption>岗位类别比较。教学样例，数据为模拟：开发 6 条，测试 4 条，合计 10 条。范围为甲市在招岗位，模拟查询日与快照日均为 2026-03-31。</figcaption>
  </figure>
</body>
</html>
